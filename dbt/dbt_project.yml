name: financas
version: "1.0.0"
profile: financas

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

models:
  financas:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
      # objetos criados pelo dbt_transform não herdam os default privileges do 0002
      +grants:
        select: ["app_user"]
