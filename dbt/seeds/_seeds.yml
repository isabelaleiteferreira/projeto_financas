version: 2

seeds:
  - name: natureza_grupos
    description: >
      Natureza financeira de cada grupo de categoria da Pluggy. Transferências e
      investimentos ficam fora de receitas e despesas para não contar o mesmo dinheiro duas vezes.
    config:
      schema: silver
      column_types:
        grupo_id: text
        natureza: text
    columns:
      - name: grupo_id
        data_tests: [unique, not_null]
      - name: natureza
        data_tests:
          - accepted_values:
              arguments:
                values: ["receita", "rendimento", "despesa", "transferencia", "investimento"]

  - name: natureza_categorias
    description: >
      Exceções por categoria e sentido que prevalecem sobre a natureza do grupo.
      Ex.: rendimento diário do CDI vem no grupo Investimentos, mas é ganho, não aplicação.
    config:
      schema: silver
      column_types:
        categoria_id: text
        sentido: text
        natureza: text
    columns:
      - name: categoria_id
        data_tests: [not_null]
      - name: sentido
        data_tests:
          - accepted_values:
              arguments:
                values: ["entrada", "saida"]
      - name: natureza
        data_tests:
          - accepted_values:
              arguments:
                values: ["receita", "rendimento", "despesa", "transferencia", "investimento"]

  - name: plano_contas
    description: >
      Plano de contas gerencial: agrupa cada natureza em Entradas, Saídas ou
      Movimentações internas e indica se ela entra no resultado do mês.
    config:
      schema: silver
      column_types:
        natureza: text
        nome: text
        grupo: text
        entra_no_resultado: boolean
        ordem: integer
    columns:
      - name: natureza
        data_tests: [unique, not_null]
